<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafío #2 - Payment Form</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>


    <main class="page-container">

        <header class="header-title"><h1>Payment Form</h1></header>
        <section class="form-card">


            <form action="#" method="POST" id="form">

                <fieldset class="form-section">
                    <legend class="section-title">Contact information</legend>

                    <div class="form-group">
                        <label for="fullname">Name <span class="required-input"></span></label>
                        <input type="text" id="fullname" name="fullname" required placeholder="Write your name" autocomplete="name">
                    </div>

                    <div class="form-group">
                        <label for="email">Email <span class="required-input"></span></label>
                        <input type="email" id="email" name="email" required placeholder="Write your email" autocomplete="tel">
                    </div>

                    <div class="form-group">
                        <label for="password">Password <span class="required-input"></span></label>
                        <input type="password" id="password" name="password" required placeholder="Write your password">
                    </div>
                </fieldset>

                <fieldset class="form-section">
                    <legend class="section-title">Payment information</legend>

                    <div class="form-group">
                        <label for="card-type">Card type:</label>
                        <select id="card-type" name="card_type">
                            <option value="Visa" selected>Visa</option>
                            <option value="Mastercard">Mastercard</option>
                            <option value="American Express">American Express</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="card-number">Card number <span class="required-input"></span></label>
                        <input type="text" id="card-number" name="card_number" required placeholder="Write your card number" pattern="[0-9\s]{13,19}" inputmode="numeric" autocomplete="cc-number">
                    </div>

                    <div class="form-group">
                        <label for="exp-date">Expiration date <span class="required-input"></span></label>
                        <input type="text" id="exp-date" name="exp_date" placeholder="MM/YY" required pattern="(0[1-9]|1[0-2])\/[0-9]{2}" autocomplete="cc-exp">
                    </div>
                </fieldset>

                <div class="form-actions">
                    <button type="submit" class="btn-submit">Validate the payment</button>
                </div>

            </form>
        </section>
    </main>



    <script src="app.js"></script>
</body>

</html>
